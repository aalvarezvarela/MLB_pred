[Database]
; local | aiven .  Defaults to `local` so nothing writes to the shared
; Postgres until it is switched on deliberately.
DB_ENV = local
DB_NAME = mlb
SCHEMA_NAME_GAMES = mlb_games
SCHEMA_NAME_TEAM_GAMES = mlb_team_games
SCHEMA_NAME_BATTERS = mlb_batter_games
SCHEMA_NAME_PITCHERS = mlb_pitcher_appearances
SCHEMA_NAME_UMPIRES = mlb_umpires
SCHEMA_NAME_LINEUPS = mlb_lineups
SCHEMA_NAME_VENUES = mlb_venues
SCHEMA_NAME_TRANSACTIONS = mlb_transactions
SCHEMA_NAME_STATCAST_GAMES = mlb_statcast
SCHEMA_NAME_STATCAST_PITCHES = mlb_statcast
SCHEMA_NAME_SNAPSHOTS = mlb_snapshots
SCHEMA_NAME_PREDICTIONS = mlb_predictions

[DatabaseLocal]
DB_USER = adrian_alvarez
DB_HOST = 127.0.0.1
DB_PORT = 5432
DB_SSLMODE = disable

[DatabaseAiven]
; Host/user/port come from the Aiven service page; AIVEN_DB_URL or
; AIVEN_DB_PASSWORD must be set via env var or config.secrets.ini.
DB_USER = avnadmin
DB_HOST =
DB_PORT = 5432
DB_SSLMODE = require
DB_NAME = mlb

[StatsApi]
BASE_URL = https://statsapi.mlb.com/api
SPORT_ID = 1
; Polite pacing. The API is unauthenticated and has no published quota, so the
; throttle is self-imposed rather than dictated.
MIN_REQUEST_INTERVAL_SECONDS = 0.12
TIMEOUT_SECONDS = 30
MAX_RETRIES = 3

[Statcast]
BASE_URL = https://baseballsavant.mlb.com
TIMEOUT_SECONDS = 120
MAX_RETRIES = 3
MIN_REQUEST_INTERVAL_SECONDS = 0.5

[Paths]
; Local raw-data copy. Gitignored; regenerable from the backfill scripts.
RAW_DATA_DIR = ./data/raw
; Point-in-time snapshot archive. NOT regenerable -- see docs.
SNAPSHOT_DIR = ./data/snapshots

[Backfill]
FIRST_SEASON = 2015

[Scraping]
HEADLESS = True
