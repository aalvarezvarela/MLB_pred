[tool.poetry]
name = "mlb_pred"
version = "0.1.0"
description = "MLB run-line and total-runs prediction project."
authors = ["Adrian Alvarez"]
packages = [{ include = "mlb_pred", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pandas = "^2.2.3"
numpy = "^2.0"
requests = ">=2.32.5,<3.0"
pyarrow = "^17.0"
tqdm = "^4.67.1"
psycopg = { version = "^3.3.2", extras = ["binary"] }
python-dateutil = "^2.9.0"
tzdata = "^2025.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0.0"
isort = "^5.13.0"
ruff = ">=0.11.6"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# -----------------------------
# Black configuration
# -----------------------------
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

# -----------------------------
# isort configuration
# -----------------------------
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
src_paths = ["."]
known_first_party = ["mlb_pred"]

# -----------------------------
# Ruff configuration
# -----------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["mlb_pred"]

# -----------------------------
# mypy configuration
# -----------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: hits the MLB Stats API over the network (run with -m live)",
]
